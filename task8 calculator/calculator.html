<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link defer href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
     integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

   
  
        <div class="calculator">
            <div class="calculator__output">
<p id="output">
0

</p>

            </div>
            
            <div class="keys">
            <div class="btn-group-vertical" role="group" aria-label="Vertical button group">
                <button type="button" class="btn btn-dark" value="1" onclick="outputOne()">1</button>
                <button type="button" class="btn btn-dark" value="4" onclick="outputFour()">4</button>
                <button type="button" class="btn btn-dark" value="7" onclick="outputSeven()">7</button>
               
              </div>
        
              <div class="btn-group-vertical" role="group" aria-label="Vertical button group">
                
                <button type="button" class="btn btn-dark" value="2" onclick="outputTwo()">2</button>
                <button type="button" class="btn btn-dark" value="5" onclick="outputFive()">5</button>
                <button type="button" class="btn btn-dark" value="8" onclick="outputEight()">8</button>
    
              </div>
              <div class="btn-group-vertical" role="group" aria-label="Vertical button group">
                <button type="button" class="btn btn-dark" value="3" onclick="outputThree()">3</button>
                <button type="button" class="btn btn-dark" value="6" onclick="outputSix()">6</button>
                <button type="button" class="btn btn-dark" value="9" onclick="outputNine()">9</button>
              </div>
    
              <div class="btn-group-horizontal" role="group" aria-label="Horizontal button group">
              <button type="button" class="btn btn-primary btn-lg" id="add" onclick="outputPlus()">+</button>
              <button type="button" class="btn btn-primary btn-lg" id="sub" onclick="outputMinus()">-</button>
              <button type="button" class="btn btn-primary btn-lg" id="mul" onclick="outputMultiply()">X</button>
            <button type="button" class="btn btn-primary btn-lg" id="div" onclick="outputDivide()">/</button>
        </div>

        <div class="btn-group-horizontal" role="group" aria-label="Horizontal button group">
            <button type="button" class="btn btn-primary btn-lg" id="equal">=</button>
            <button type="button" class="btn btn-primary btn-lg" id="c">C</button>
      </div>
    </div>


          </div>

        
   
   
</div>




</div>


</div>



    
  </body>
</html>
